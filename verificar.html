<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Verificar Mano Zombie</title>
<style>body{font-family:system-ui,sans-serif;background:#0a0a12;color:#eee;max-width:420px;margin:30px auto;padding:0 16px}
input,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #333;background:#14141f;color:#eee;font-size:15px}
button{background:#2c4a21;border:0;font-weight:700;cursor:pointer}#out{margin-top:14px;padding:14px;border-radius:10px;background:#14141f;line-height:1.7;display:none}
.ok{color:#9be36f}.mal{color:#ff6b6b}</style></head><body>
<h2>🧟 Verificar Mano Zombie</h2>
<input id="k" type="password" placeholder="Clave de administrador" autocomplete="current-password">
<input id="c" placeholder="Código (ZB-XXXXXXXX)" autocapitalize="characters">
<button id="v">Verificar</button><button id="x" style="display:none">Marcar como canjeado</button>
<div id="out"></div>
<script>
const $=i=>document.getElementById(i), out=$('out'); try{$('k').value=sessionStorage.getItem('k')||''}catch(e){}
async function call(m){
  try{sessionStorage.setItem('k',$('k').value)}catch(e){}
  const code=$('c').value.trim(), h={'x-admin-key':$('k').value,'Content-Type':'application/json'};
  const r=m==='GET'?await fetch('/api/verificar?code='+encodeURIComponent(code),{headers:h}):await fetch('/api/verificar',{method:'POST',headers:h,body:JSON.stringify({code,accion:'canjear'})});
  const j=await r.json().catch(()=>({error:'sin respuesta'})); out.style.display='block';
  if(!r.ok){ out.innerHTML='<b class="mal">'+(j.error||'Error')+'</b>'; $('x').style.display='none'; return; }
  out.innerHTML='<b class="ok">✓ Código válido</b><br>Dedos: <b>'+j.fingers+'</b> → premio <b>'+j.prize+' CUP</b><br>Pedido declarado: '+j.total+' CUP<br>Generada: '+new Date(j.t).toLocaleString()+'<br>Estado: <b>'+(j.estado==='canjeado'?'YA CANJEADO ('+new Date(j.canjeado).toLocaleString()+')':'pendiente')+'</b>';
  $('x').style.display=j.estado==='canjeado'?'none':'block';
}
$('v').onclick=()=>call('GET'); $('x').onclick=()=>{ if(confirm('¿Marcar como canjeado?')) call('POST'); };
</script></body></html>
