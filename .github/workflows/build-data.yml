# Regenera la carpeta data/ automáticamente cada vez que subes un CSV (o build_data.py).
# Ponlo en tu repo en:  .github/workflows/build-data.yml
name: Generar data/

on:
  push:
    branches: [main]
    paths:
      - '*.csv'
      - 'build_data.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar data/
        run: python build_data.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Regenerar data/ [skip ci]" && git push)
